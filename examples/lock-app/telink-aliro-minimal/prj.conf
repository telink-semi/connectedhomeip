# This sample uses Kconfig.defaults to set options common for all
# samples. This file should contain only options specific for this sample
# or overrides of default values.

# Enable CHIP
CONFIG_CHIP=y
CONFIG_STD_CPP17=y

# 32774 == 0x8006 (example lock-app)
CONFIG_CHIP_DEVICE_PRODUCT_ID=32774

# Bluetooth Low Energy is owned by Matter and used only for commissioning.
CONFIG_BT_DEVICE_NAME="TelinkLock"

# Disable Matter OTA DFU
CONFIG_CHIP_OTA_REQUESTOR=n
CONFIG_CHIP_DEVICE_SOFTWARE_VERSION=1

# Disable CHIP shell support
CONFIG_CHIP_LIB_SHELL=n
CONFIG_CHIP_PERSISTENT_SUBSCRIPTIONS=n
CONFIG_CHIP_MAX_FABRICS=2

# Disable factory data support
CONFIG_CHIP_FACTORY_DATA=n
CONFIG_CHIP_FACTORY_DATA_BUILD=n
CONFIG_CHIP_FACTORY_DATA_MERGE_WITH_FIRMWARE=n

# Telink PM integration is a separate pass from Aliro linkability.
CONFIG_PM=n
CONFIG_CHIP_THREAD_DEVICE_ROLE_END_DEVICE=y

# Aliro libraries use Zephyr runtime logging APIs.
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_ALWAYS_RUNTIME=y

# Aliro release-one transport: NFC with the CLRC663 frontend.
CONFIG_ALIRO_TRANSPORT_NFC=y
CONFIG_ALIRO_NFC_POLLER_THREAD_STACK_SIZE=4096
CONFIG_BT_MAX_CONN=1

# NFC frontend support used by the Aliro ECP poller.
CONFIG_GPIO=y
CONFIG_SPI=y

# Aliro crypto requirements not already guaranteed by Matter defaults.
CONFIG_MBEDTLS_SHA1=y
CONFIG_MBEDTLS_HMAC_DRBG_ENABLED=y
CONFIG_MBEDTLS_MD=y
CONFIG_MBEDTLS_CIPHER_GCM_ENABLED=y

# The standalone base profile uses 12 KiB. Reserve 16 KiB until runtime
# high-water measurements establish the combined Matter + Aliro requirement.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=16384

# Probe-only RAM trims. These need product validation before becoming real defaults.
CONFIG_CHIP_TASK_STACK_SIZE=4096
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=1024
CONFIG_LOG_PROCESS_THREAD_STACK_SIZE=2048

CONFIG_OPENTHREAD_THREAD_STACK_SIZE=2048
CONFIG_OPENTHREAD_NUM_MESSAGE_BUFFERS=32

CONFIG_NET_PKT_RX_COUNT=4
CONFIG_NET_PKT_TX_COUNT=4
CONFIG_NET_BUF_RX_COUNT=8
CONFIG_NET_BUF_TX_COUNT=8

CONFIG_NVS_LOOKUP_CACHE_SIZE=256
CONFIG_SETTINGS_NVS_NAME_CACHE_SIZE=64
CONFIG_SETTINGS_NVS_SECTOR_COUNT=2

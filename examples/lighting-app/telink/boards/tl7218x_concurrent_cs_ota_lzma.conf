# TL7218X Concurrent Mode + Channel Sounding (RAS Reflector) with OTA
# This config enables BLE + 802.15.4 coexistence mode with Channel Sounding and OTA support.
# Usage:
#   west build -p -b tl7218x -d build_tl7218x_concurrent_cs_ota_v1 -- \
#   -DCONF_FILE="prj.conf boards/tl7218x_concurrent_cs_ota.conf" \
#   -DCONFIG_CHIP_DEVICE_SOFTWARE_VERSION=1 > build_tl7218x_concurrent_cs_ota_v1.log

# Enable concurrent mode (Matter over Thread + BLE)
CONFIG_CHIP_CONCURRENT_MODE=y
CONFIG_IEEE802154_TLX_BLE_COEXIST=y

# Channel Sounding (RAS Reflector)
CONFIG_BT_CHANNEL_SOUNDING=y
CONFIG_BT_TLX_CHANNEL_SOUNDING=y
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_GATT_CLIENT=y

# BLE buffers for RAS data transfer (reduced for OT coexistence)
CONFIG_BT_BUF_ACL_RX_SIZE=251
CONFIG_BT_BUF_ACL_TX_SIZE=251
CONFIG_BT_BUF_ACL_TX_COUNT=4
CONFIG_BT_BUF_EVT_RX_COUNT=6
CONFIG_BT_L2CAP_TX_BUF_COUNT=4
CONFIG_BT_L2CAP_TX_MTU=247
CONFIG_BT_ATT_TX_COUNT=4

# SMP: Unauthenticated Pairing with Encryption (LE Security Mode 1 Level 2)
CONFIG_BT_SMP=y
# BT_HOST_CRYPTO satisfies BT_RPA dependency; PRNG=n avoids PSA bt_rand conflict
CONFIG_BT_HOST_CRYPTO=y
CONFIG_BT_HOST_CRYPTO_PRNG=n
# CRITICAL: Disable PSA in PK/MD/Cipher modules, otherwise CSR generation fails
# with MBEDTLS_ERR_PK_FEATURE_UNAVAILABLE (-0x3980)
CONFIG_MBEDTLS_USE_PSA_CRYPTO=n
CONFIG_BT_SMP_SC_PAIR_ONLY=n
CONFIG_BT_SMP_ENFORCE_MITM=n
CONFIG_BT_SMP_ALLOW_UNAUTH_OVERWRITE=y
CONFIG_BT_KEYS_OVERWRITE_OLDEST=y

# Bonding: persist pairing keys in flash
CONFIG_BT_SETTINGS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_SETTINGS=y

# Stack sizes for CS + BLE + Thread coexistence
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_ISR_STACK_SIZE=2048
CONFIG_IDLE_STACK_SIZE=1536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_BT_RX_STACK_SIZE=2048
CONFIG_TL_BLE_CTRL_THREAD_STACK_SIZE=8192
CONFIG_NET_TX_STACK_SIZE=1200

# CONFIG_CHIP_DEVICE_SERIAL_NUMBER="TelinkLight-tl7218x"

# Enable Matter OTA DFU
CONFIG_CHIP_OTA_REQUESTOR=y

CONFIG_CHIP_DFU_OVER_BT_SMP=y
CONFIG_CHIP_DFU_OVER_BT_SMP_BUILD=y

# LZMA compression library support
CONFIG_LZMA=y
CONFIG_COMPRESS_LZMA=y

# Enable ADC
CONFIG_ADC=n

# matter switch mode 
# config NORMAL_MODE    0 independent matter mode
# ACTION_DUAL_MODE      1 matter action switch mode ,such as by button, light-switch-app
# AUTO_SWITCH_DUAL_MODE 2 matter auto-switch mode ,such as lighting-app by scan QR code.should use 4m flash
CONFIG_DUAL_MODE=0
